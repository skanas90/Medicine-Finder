<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Medicine Finder</title>
    <!-- Add Bootstrap or custom CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <!-- Admin Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <a class="navbar-brand" href="#">Admin Dashboard</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item active">
                    <a class="nav-link" href=>Add Pharmacy</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('view_pharmacies') }}">View Pharmacies</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href=""></a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#"></a>
                </li>
            </ul>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container mt-5">
        <div class="row">
            <!-- Add Pharmacy Form -->
            <div class="col-md-6">
                <h2>Add Pharmacy</h2>
                <form action="{{ url_for('add_pharmacy') }}" method="POST">
                    <!-- Form Fields -->
                    <div class="form-group">
                        <label for="name">Pharmacy Name</label>
                        <input type="text" class="form-control" id="name" name="name" placeholder="Enter pharmacy name" required>
                    </div>

                    <div class="form-group">
                        <label for="address">Address</label>
                        <input type="text" class="form-control" id="address" name="address" placeholder="Enter pharmacy address" required>
                    </div>

                    <div class="form-group">
                        <label for="available_medicines">Available Medicines</label>
                        <input type="text" class="form-control" id="available_medicines" name="available_medicines" placeholder="List available medicines" required>
                    </div>

                    <div class="form-group">
                        <label for="timings">Timings</label>
                        <input type="text" class="form-control" id="timings" name="timings" placeholder="Enter working hours">
                    </div>

                    <div class="form-group">
                        <label for="contact_number">Contact Number</label>
                        <input type="text" class="form-control" id="contact_number" name="contact_number" placeholder="Enter contact number">
                    </div>

                    <div class="form-row">
                        <div class="col">
                            <label for="latitude">Latitude</label>
                            <input type="text" class="form-control" id="latitude" name="latitude" placeholder="Latitude">
                        </div>
                        <div class="col">
                            <label for="longitude">Longitude</label>
                            <input type="text" class="form-control" id="longitude" name="longitude" placeholder="Longitude">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary mt-3">Add Pharmacy</button>
                </form>
            </div>

          
            </div>
        </div>
    </div>

    <!-- Optional JavaScript (for Bootstrap functionality) -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
